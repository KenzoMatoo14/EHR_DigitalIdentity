<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECE UP | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body style="background:var(--fig-bar);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
  <div style="width:100%;max-width:440px">
    <div class="fig-card" style="padding:32px">
      <div style="display:flex;align-items:center;gap:15px;margin-bottom:24px">
        <div class="fig-brand-box" style="width:44px;height:44px;font-size:18px" aria-hidden="true">UP</div>
        <div>
          <h1 style="font-size:20px;font-weight:600;line-height:1.15;margin:0">Expediente Clínico Electronico</h1>
          <p class="soap-hint" style="margin:2px 0 0">Departamento Medico - Universidad Panamericana</p>
        </div>
      </div>

      <form id="loginForm" novalidate>
        <div class="fig-field">
          <label for="email" class="fig-label">Correo institucional</label>
          <input type="email" id="email" autocomplete="username" required class="fig-input" placeholder="nombre@up.edu.mx">
        </div>
        <div class="fig-field">
          <label for="password" class="fig-label">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required class="fig-input" placeholder="Contraseña">
        </div>
        <p id="loginError" class="fig-modal-error hidden" role="alert"></p>
        <button type="submit" id="loginBtn" class="fig-btn-navy" style="width:100%">Iniciar sesión</button>
      </form>
    </div>

    <!-- Aviso de modo demostración: aquí no hay backend, las cuentas son de ejemplo -->
    <div class="fig-card" style="margin-top:14px;padding:16px 18px;font-size:14px">
      <p style="font-weight:600;margin:0 0 6px">Modo demostración (sin backend)</p>
      <p style="margin:0 0 12px;color:var(--c-text-muted)">Los datos son ficticios y viven solo en este navegador. Usa una cuenta de ejemplo:</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" data-demo-email="recepcion@up.edu.mx" class="fig-btn fig-btn-neutral" style="height:auto;min-height:56px;flex:1;flex-direction:column;align-items:flex-start;padding:8px 12px;font-size:14px;white-space:normal">
          <strong>Recepción / Enfermería</strong><span>recepcion@up.edu.mx</span>
        </button>
        <button type="button" data-demo-email="medico@up.edu.mx" class="fig-btn fig-btn-neutral" style="height:auto;min-height:56px;flex:1;flex-direction:column;align-items:flex-start;padding:8px 12px;font-size:14px;white-space:normal">
          <strong>Médico general</strong><span>medico@up.edu.mx</span>
        </button>
      </div>
      <p style="margin:12px 0 0;font-size:12px;color:var(--c-text-muted)">Contraseña de ambas: <code style="font-family:monospace">demo1234</code></p>
    </div>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>

</html>
