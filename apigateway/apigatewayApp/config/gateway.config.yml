# Electronic Health Record services (base de datos convencional MySQL, sin blockchain)

  #Guardar / consultar Ficha de identificación (POST crea o actualiza, GET consulta por ?curp=)
  ehrFichaIdentificacion:
    host:  localhost
    paths: '/fichaIdentificacion'

  ehrFichaIdentificacionB:
    host:  '172.18.1.8'
    paths: '/fichaIdentificacion'

  #Guardar / consultar Antecedentes (POST crea o actualiza, GET consulta por ?curp=)
  ehrAntecedentes:
    host:  localhost
    paths: '/antecedentes'

  ehrAntecedentesB:
    host:  '172.18.1.4'
    paths: '/antecedentes'

  #Agregar / consultar Notas SOAP (POST agrega, GET lista por ?curp=; no se editan)
  ehrNotaSoap:
    host:  localhost
    paths: '/notaSoap'

  ehrNotaSoapB:
    host:  '172.18.1.4'
    paths: '/notaSoap'

  #Buscar pacientes (GET ?q= nombre, CURP o folio; solo lectura)
  ehrPacientes:
    host:  localhost
    paths: '/pacientes'

  ehrPacientesB:
    host:  '172.18.1.4'
    paths: '/pacientes'

  #Buscar datos de una persona en ChainIDentity para prellenar el registro (GET ?curp= o ?idInstitucional=; solo lectura)
  ehrChainIdentity:
    host:  localhost
    paths: '/chainIdentity'

  ehrChainIdentityB:
    host:  '172.18.1.4'
    paths: '/chainIdentity'



serviceEndpoints:
  httpbin:
    url: 'https://httpbin.org'

  scholarcurriculum:
    url: 'http://172.18.1.8:5504'

  users:
    url: 'http://172.18.1.7:5503'

  didentity:
    url: 'http://172.18.1.6:5502'

  birthcertificate:
    url: 'http://172.18.1.5:5501'   #this is the name of the host

  electronichealthrecord:
    # El EHR corre en la máquina (no en un contenedor). Dentro del contenedor del Gateway "localhost" es el
    # propio contenedor; host.docker.internal es el nombre que Docker Desktop da a la máquina anfitriona.
    url: 'http://host.docker.internal:5505'

policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit
pipelines:
  default:
    apiEndpoints:
      - api
    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: httpbin 
              changeOrigin: true
  genesisPipeline:
    apiEndpoints:
      - birthcertificateproof
      - birthcertificateCreate
      - birthcertificateConsult
      - birthcertificateSetAddress
      - birthcertificateproofB
      - birthcertificateCreateB
      - birthcertificateConsultB
      - birthcertificateSetAddressB
      - birthcertificatPrivate
      - birthcertificatPrivateB      

    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: birthcertificate 
              changeOrigin: true

  didentityPipeline:
    apiEndpoints:      
      - didentityCreate   
      - didentityCreateB  
      - didentitylinkToken
      - didentitylinkTokenB  
      - didentityconsultTokens
      - didentityconsultTokensB
      - didentityconsultTokenCreator
      - didentityconsultTokenCreatorB
      - didentityconsultCreatorIsGovernment
      - didentityconsultCreatorIsGovernmentB
      - didentityconsultNumberToken
      - didentityconsultNumberTokenB
      - didentityConsult
      - didentityConsultB
      - didentityProof
      - didentityProofB
    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: didentity 
              changeOrigin: true

  usersPipeline:
    apiEndpoints:      
      - usersCreate
      - usersCreateB
      - usersConsult
      - usersConsultB
      - usersGetInfo
      - usersGetInfoB
      - usersRegister
      - usersRegisterB
      - usersProof
      - usersProofB
    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: users 
              changeOrigin: true


  scholarcurriculumPipeline:
    apiEndpoints:      
      - scholarcurriculumProof
      - scholarcurriculumProofB
      - scholarcurriculumCreate
      - scholarcurriculumCreateB
      - scholarcurriculumaddAchievement
      - scholarcurriculumaddAchievementB
      - scholarcurriculumconsultCertificate
      - scholarcurriculumconsultCertificateB
      - scholarcurriculumnumberOfAchievements
      - scholarcurriculumnumberOfAchievementsB
      
    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: scholarcurriculum
              changeOrigin: true

  ehrPipeline:
    apiEndpoints:
      - ehrFichaIdentificacion
      - ehrFichaIdentificacionB
      - ehrAntecedentes
      - ehrAntecedentesB
      - ehrNotaSoap
      - ehrNotaSoapB
      - ehrPacientes
      - ehrPacientesB
      - ehrChainIdentity
      - ehrChainIdentityB
    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: electronichealthrecord
              changeOrigin: true

